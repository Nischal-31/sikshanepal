{% extends "base.html" %}
{% block title %}Delete Question - {{ question.quiz.title }}{% endblock %}

{% block content %}
<div class="container py-6 max-w-md mx-auto text-center">
  <h2 class="text-2xl font-bold mb-4">Delete Question</h2>
  <p class="mb-6 text-gray-700">
    Are you sure you want to delete this question from quiz: <strong>{{ question.quiz.title }}</strong>?
  </p>
  <p class="mb-6 text-gray-600 italic">"{{ question.question_text }}"</p>

  <form method="post">
    {% csrf_token %}
    <div class="flex justify-center gap-4">
      <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition">
        Delete
      </button>
      <a href="{% url 'quiz:add_question' question.quiz.id %}" class="bg-gray-300 text-gray-900 px-6 py-2 rounded-lg hover:bg-gray-400 transition">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
