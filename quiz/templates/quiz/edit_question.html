{% extends "base.html" %}
{% block title %}Edit Question - {{ quiz.title }}{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 800px;">
    <br>
    <br>
    <br>
    <br>

    <h2 class="mb-4">Edit Question for: <span class="text-primary">{{ quiz.title }}</span></h2>

    <form method="post">
        {% csrf_token %}
        
        <!-- Question Text -->
        <div class="mb-3">
            <label for="question_text" class="form-label">Question</label>
            <input type="text" class="form-control" id="question_text" name="question_text"
                   value="{{ question.question_text }}">
        </div>

        <!-- Marks -->
        <div class="mb-3">
            <label for="marks" class="form-label">Marks</label>
            <input type="number" class="form-control" id="marks" name="marks"
                   value="{{ question.marks }}">
        </div>

        <!-- Options -->
        <div class="mb-3">
            <label class="form-label">Options</label>
            <div class="list-group">
                {% for option in options %}
                <div class="list-group-item d-flex align-items-center justify-content-between">
                    <div class="form-check d-flex align-items-center flex-grow-1">
                        <input class="form-check-input me-2" type="radio" name="correct_option"
                               value="{{ forloop.counter0 }}" {% if option.is_correct %}checked{% endif %}>
                        <input type="text" class="form-control" name="option_text[]"
                               value="{{ option.option_text }}">
                    </div>
                    <a href="{% url 'quiz:delete_option' option.id %}"
                       class="btn btn-sm btn-danger ms-2"
                       onclick="return confirm('Are you sure you want to delete this option?');">
                        Delete
                    </a>
                </div>
                {% endfor %}

                <!-- Add new blank option -->
                <div class="list-group-item d-flex align-items-center">
                    <div class="form-check d-flex align-items-center flex-grow-1">
                        <input class="form-check-input me-2" type="radio" name="correct_option"
                               value="{{ options|length }}">
                        <input type="text" class="form-control" name="option_text[]" placeholder="New option">
                    </div>
                </div>
            </div>
        </div>

        <!-- Form actions -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'quiz:add_question' quiz.id %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
