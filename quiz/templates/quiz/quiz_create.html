{% extends "base.html" %}
{% block title %}Create Quiz - {{ subject.name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <br>
  <br>
  <br>
  <br>

  <h2>Create Quiz for {{ subject.name }}</h2>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="title" class="form-label">Quiz Title</label>
      <input type="text" name="title" id="title" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="total_marks" class="form-label">Total Marks</label>
      <input type="number" name="total_marks" id="total_marks" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="time_limit" class="form-label">Time Limit (minutes)</label>
      <input type="number" name="time_limit" id="time_limit" class="form-control">
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" name="is_active" id="is_active" class="form-check-input" checked>
      <label for="is_active" class="form-check-label">Active</label>
    </div>
    <button type="submit" class="btn btn-primary">Create Quiz</button>
  </form>
</div>
{% endblock %}
