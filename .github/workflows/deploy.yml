name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sikshanepal:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sikshanepal:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/sikshanepal
            cd ~/sikshanepal
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/Nischal-31/sikshanepal.git
            fi
            git fetch origin master
            git checkout -f master
            git pull origin master
            docker compose pull web
            docker compose up -d
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py createsuperuser --noinput || true
            docker image prune -f