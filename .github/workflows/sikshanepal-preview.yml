name: SikshaNepal Preview QA

on:
  pull_request:
    branches:
      - preview

permissions:
  contents: read

jobs:
  preview-qa:
    name: Preview QA Checks
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: ${{ secrets.DEBUG }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
      BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: |
          python manage.py check

      - name: Run tests
        run: |
          python manage.py test

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t sikshanepal-preview:${{ github.sha }} .

  discord-success:
    name: Discord Success Notification
    needs: preview-qa
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "content": "SikshaNepal Preview QA - PASSED\n\nPR: #${{ github.event.pull_request.number }}\nBranch: ${{ github.head_ref }} → ${{ github.base_ref }}\nCommit: ${{ github.event.pull_request.head.sha }}\nDeveloper: ${{ github.event.pull_request.user.login }}\nStatus: Preview checks passed"
            }' \
            "$DISCORD_WEBHOOK_URL"

  discord-failure:
    name: Discord Failure Notification
    needs: preview-qa
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "content": "SikshaNepal Preview QA - FAILED\n\nPR: #${{ github.event.pull_request.number }}\nBranch: ${{ github.head_ref }} → ${{ github.base_ref }}\nCommit: ${{ github.event.pull_request.head.sha }}\nDeveloper: ${{ github.event.pull_request.user.login }}\nStatus: Preview blocked - please check GitHub Actions"
            }' \
            "$DISCORD_WEBHOOK_URL"