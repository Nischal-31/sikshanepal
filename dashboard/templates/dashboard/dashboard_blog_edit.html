{% extends 'dashboard/base.html' %}

{% block title %}Edit Blog - {{ blog.title }}{% endblock %}
{% block page_heading %}Edit Blog{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

  <!-- Breadcrumb -->
  <nav class="flex mb-6" aria-label="Breadcrumb">
    <ol class="inline-flex items-center space-x-1 md:space-x-3">
      <li class="inline-flex items-center">
        <a href="{% url 'home' %}" class="text-gray-600 hover:text-blue-600 inline-flex items-center">
          <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
          </svg>
          Dashboard
        </a>
      </li>
      <li>
        <div class="flex items-center">
          <svg class="w-5 h-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
          </svg>
          <a href="{% url 'blogs' %}" class="ml-1 text-gray-600 hover:text-blue-600 md:ml-2">Blogs</a>
        </div>
      </li>
      <li aria-current="page">
        <div class="flex items-center">
          <svg class="w-5 h-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
          </svg>
          <span class="ml-1 text-gray-400 md:ml-2">Edit Blog</span>
        </div>
      </li>
    </ol>
  </nav>

  <div class="bg-white rounded-lg shadow-md overflow-hidden border border-gray-200 p-6">

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Blog Title -->
        <div class="col-span-2">
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Title</label>
          <input type="text" name="title" value="{{ post.title }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <!-- Blog Category -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Category</label>
          <select name="category" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-blue-500 focus:border-blue-500">
            {% for key, value in post.CATEGORY_CHOICES %}
              <option value="{{ key }}" {% if post.category == key %}selected{% endif %}>{{ value }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Blog Status -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Status</label>
          <select name="status" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="draft" {% if post.status == 'draft' %}selected{% endif %}>Draft</option>
            <option value="published" {% if post.status == 'published' %}selected{% endif %}>Published</option>
          </select>
        </div>

        <!-- Blog Image -->
        <div class="col-span-2">
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Featured Image</label>
          {% if post.image %}
            <img src="{{ post.image.url }}" alt="{{ post.title }}" class="w-full h-64 object-cover rounded-lg mb-2">
          {% endif %}
          <input type="file" name="image" class="w-full border border-gray-300 rounded-lg px-4 py-2">
        </div>

        <!-- Blog Content -->
        <div class="col-span-2">
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Content</label>
          <textarea name="content" rows="12" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-blue-500 focus:border-blue-500">{{ post.content }}</textarea>
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="mt-6 flex flex-wrap gap-3">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-medium transition-all">
          Save Changes
        </button>
        <a href="{% url 'dashboard_blog_detail' post.id %}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 font-medium transition-all">
          Cancel
        </a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
