{% extends 'dashboard/base.html' %}
{% block title %}Edit Quiz - {{ quiz.title }}{% endblock %}
{% block page_heading %}Edit Quiz{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">

  <form method="post">
    {% csrf_token %}
    
    <div class="grid grid-cols-1 gap-4">
      <!-- Title -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Title</label>
        {{ form.title }}
      </div>

      <!-- Total Marks -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Total Marks</label>
        {{ form.total_marks }}
      </div>

      <!-- Time Limit -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Time Limit (minutes)</label>
        {{ form.time_limit }}
      </div>

      <!-- Is Active -->
      <div class="flex items-center space-x-2">
        {{ form.is_active }}
        <label class="block text-sm font-medium text-gray-700">Active?</label>
      </div>

      <!-- Buttons -->
      <div class="pt-4 flex gap-2">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save Changes</button>
        <a href="{% url 'quizzes' %}" class="px-4 py-2 bg-gray-300 text-gray-900 rounded hover:bg-gray-400">Cancel</a>
      </div>
    </div>
  </form>

</div>
{% endblock %}
