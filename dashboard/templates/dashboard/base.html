
<!-- base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .stat-card {
      animation: slideIn 0.4s ease-out forwards;
    }
    
    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    .stat-card:nth-child(4) { animation-delay: 0.4s; }
    
    .nav-link {
      position: relative;
      transition: all 0.3s ease;
    }
    
    .nav-link::before {
      content: '';
      position: absolute;
      left: -20px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 0;
      background: #2563eb;
      transition: height 0.3s ease;
      border-radius: 0 2px 2px 0;
    }
    
    .nav-link:hover::before,
    .nav-link.active::before {
      height: 100%;
    }
    
    .chart-container {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .chart-container:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="flex bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">

  <!-- Sidebar -->
  {% include 'dashboard/sidebar.html' %}

  <!-- Main content -->
  <main class="flex-1 p-6 lg:p-8 overflow-y-auto">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
      <div>
        <h1 class="text-3xl lg:text-4xl font-bold text-gray-900 mb-1">{% block page_heading %}Dashboard{% endblock %}</h1>
        <p class="text-gray-500 text-sm">Welcome back! Here's what's happening today.</p>
      </div>
      <div class="flex gap-3">
        <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium shadow-sm">
          <a href="{% url 'index' %}">
          <span class="hidden sm:inline">Logout</span>
          <span class="sm:hidden"></span>
          </a>
        </button>
      </div>
    </div>

    <!-- Content -->
    {% block content %}{% endblock %}
  </main>

</body>
</html>
<!-- End of base.html -->
