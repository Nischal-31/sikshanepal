{% extends 'dashboard/base.html' %}

{% block title %}Add New Semester | SikshaNepal{% endblock %}
{% block page_heading %}Add New Semester{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

  <!-- Breadcrumb -->
  <nav class="flex mb-6" aria-label="Breadcrumb">
    <ol class="inline-flex items-center space-x-1 md:space-x-3">
      <li class="inline-flex items-center">
        <a href="{% url 'home' %}" class="text-gray-600 hover:text-blue-600 inline-flex items-center">
          Dashboard
        </a>
      </li>
      <li>
        <div class="flex items-center">
          <svg class="w-5 h-5 text-gray-400 mx-1" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
          </svg>
          <a href="{% url 'dashboard_manage_semesters' course_id %}" class="text-gray-600 hover:text-blue-600 md:ml-2">
            Semesters
          </a>
        </div>
      </li>
      <li aria-current="page">
        <div class="flex items-center">
          <svg class="w-5 h-5 text-gray-400 mx-1" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
          </svg>
          <span class="text-gray-400 md:ml-2">Add Semester</span>
        </div>
      </li>
    </ol>
  </nav>

  <!-- Form Card -->
  <div class="bg-white rounded-lg shadow-md border border-gray-200 p-6">
    <form method="POST">
      {% csrf_token %}

      <div class="grid grid-cols-1 gap-6">
        <!-- Semester Number -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1" for="number">Semester Number</label>
          <input type="number" name="number" id="number" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 placeholder="Enter semester number">
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1" for="description">Description</label>
          <textarea name="description" id="description" rows="4"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter semester description"></textarea>
        </div>
      </div>

      <!-- Form Actions -->
      <div class="mt-6 flex gap-3">
        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 font-medium transition-all">
          Add Semester
        </button>
        <a href="{% url 'dashboard_manage_semesters' course_id %}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 font-medium transition-all">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
