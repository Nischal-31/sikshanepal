{% extends 'dashboard/base.html' %}

{% block title %}Delete Blog - {{ post.title }}{% endblock %}
{% block page_heading %}Delete Blog{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-6 bg-white rounded-lg shadow-md border border-gray-200">
  <h2 class="text-xl font-bold text-gray-900 mb-4">Are you sure you want to delete this blog?</h2>
  <p class="text-gray-700 mb-4"><strong>{{ post.title }}</strong></p>

  <form method="POST">
    {% csrf_token %}
    <div class="flex gap-3">
      <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 font-medium">
        Yes, Delete
      </button>
      <a href="{% url 'dashboard_blog_detail' post.id %}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 font-medium">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
