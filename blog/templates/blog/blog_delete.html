{% extends "base.html" %}
{% load static %}

{% block title %}Delete Blog{% endblock %}

{% block content %}
<section class="py-4 bg-light mb-4">
  <div class="container">
    <h2 class="mb-0">Delete Blog Post</h2>
  </div>
</section>

<div class="container mb-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h4>Are you sure you want to delete this post?</h4>
          <p><strong>{{ post.title }}</strong></p>

          <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
            <a href="{% url 'blog_list' %}" class="btn btn-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
